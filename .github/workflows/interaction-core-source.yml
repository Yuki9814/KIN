name: interaction-core-source-snapshot

on:
  push:
    branches:
      - feature/interaction-core-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interaction-core-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Package public Apple sources
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kin-interaction-core-source.tar.gz"
          tar -czf "$archive" Ayane AyaneTests Ayane.xcodeproj
          echo "KIN_SOURCE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kin-interaction-core-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.KIN_SOURCE_ARCHIVE }}
