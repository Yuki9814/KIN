name: windows-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test Windows desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "multiplatform/gradlew.bat")) {
            throw "multiplatform/gradlew.bat is required for the Windows build"
          }
          Push-Location multiplatform
          try {
            $env:ORG_GRADLE_PROJECT_kinVersion = "0.1.0"
            .\gradlew.bat --no-daemon --console=plain test :desktopApp:packageExe :desktopApp:packageMsi
          } finally {
            Pop-Location
          }

      - name: Print jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem "multiplatform/desktopApp/build/compose/logs" -Recurse -File -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) {
            Write-Output "No jpackage logs were produced."
          }
          foreach ($log in $logs) {
            Write-Output "::group::$($log.Name)"
            Get-Content -LiteralPath $log.FullName
            Write-Output "::endgroup::"
          }

      - name: Verify package outputs and print SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msiDir = "multiplatform/desktopApp/build/compose/binaries/main/msi"
          $exeDir = "multiplatform/desktopApp/build/compose/binaries/main/exe"
          $msi = @(Get-ChildItem -LiteralPath $msiDir -Filter "*.msi" -File -ErrorAction Stop)
          $exe = @(Get-ChildItem -LiteralPath $exeDir -Filter "*.exe" -File -ErrorAction Stop)
          if ($msi.Count -ne 1 -or $exe.Count -ne 1) {
            throw "Windows CI requires exactly one MSI and one EXE in their explicit output directories"
          }
          foreach ($package in @($msi[0], $exe[0])) {
            if ($package.Length -le 0) { throw "Windows package is empty: $($package.FullName)" }
            $signature = Get-AuthenticodeSignature -LiteralPath $package.FullName
            if ($signature.Status -eq "Error") { throw "Authenticode inspection failed: $($package.Name)" }
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
            Write-Output ("{0}  {1}" -f $digest, $package.Name)
          }
          python scripts/kin-release-asset-gate.py --windows-only $msi[0].FullName $exe[0].FullName
